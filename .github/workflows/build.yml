name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Rust stable (userspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang libelf-dev libbpf-dev musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/bpf-linker
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install bpf-linker
        run: |
          command -v bpf-linker >/dev/null 2>&1 || cargo +nightly install bpf-linker

      - name: Build eBPF
        run: cd ebpf && cargo +nightly build --release

      - name: Find eBPF artifacts
        run: |
          echo "=== ebpf/target/bpfel-unknown-none/release/ ==="
          ls -la ebpf/target/bpfel-unknown-none/release/ 2>/dev/null || echo "directory not found"
          echo "=== all .so and .o files ==="
          find ebpf/target -name "*.so" -o -name "*.o" -o -name "ebpf*" 2>/dev/null | head -20

      - name: Build userspace (static)
        run: cargo +stable build --release -p firewall-ctl --target x86_64-unknown-linux-musl

      - name: Verify static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/firewall-ctl
          ldd target/x86_64-unknown-linux-musl/release/firewall-ctl 2>&1 || true

      - name: Prepare release files
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/firewall-ctl release/
          # eBPF 产物可能是 .so 或其他格式，全部复制
          find ebpf/target/bpfel-unknown-none/release -maxdepth 1 -name "*ebpf_firewall*" -type f ! -name "*.d" -exec cp {} release/ \;
          ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firewall-binaries-x86_64
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
