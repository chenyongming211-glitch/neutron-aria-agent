name: Build

on:
  push:
    branches: [main, 'v*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Rust stable (userspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang libelf-dev libbpf-dev musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/bpf-linker
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install bpf-linker
        run: |
          command -v bpf-linker >/dev/null 2>&1 || cargo +nightly install bpf-linker

      - name: Build eBPF
        run: |
          export LD_LIBRARY_PATH="$(rustc +nightly --print sysroot)/lib:${LD_LIBRARY_PATH:-}"
          cd ebpf
          cargo +nightly build --release --target bpfel-unknown-none -Z build-std=core --target-dir target
          echo "=== eBPF output candidates ==="
          find target -type f \( -name "libebpf_firewall.so" -o -name "ebpf-firewall" \) \
            -printf '%s %p\n' 2>/dev/null | sort -nr
          ebpf_artifact="$(find target -type f \
            \( -path "*/release/libebpf_firewall.so" -o -path "*/release/ebpf-firewall" \) \
            -size +0c 2>/dev/null | head -1)"
          if [ -z "$ebpf_artifact" ]; then
            echo "non-empty eBPF artifact not found" >&2
            find target -maxdepth 5 -type f 2>/dev/null | sort | head -200 >&2
            exit 1
          fi
          file "$ebpf_artifact"
          mkdir -p ../ebpf-artifacts
          cp "$ebpf_artifact" ../ebpf-artifacts/libebpf_firewall.so

      - name: Find eBPF artifacts
        run: |
          ls -lh ebpf-artifacts/
          file ebpf-artifacts/libebpf_firewall.so

      - name: Build userspace (static)
        run: cargo +stable build --release -p ariactl --target x86_64-unknown-linux-musl

      - name: Build agent (static)
        run: cargo +stable build --release -p aria-agent --target x86_64-unknown-linux-musl

      - name: Verify static binaries
        run: |
          file target/x86_64-unknown-linux-musl/release/ariactl
          ldd target/x86_64-unknown-linux-musl/release/ariactl 2>&1 || true
          file target/x86_64-unknown-linux-musl/release/aria-agent
          ldd target/x86_64-unknown-linux-musl/release/aria-agent 2>&1 || true

      - name: Prepare release files
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/ariactl release/
          cp target/x86_64-unknown-linux-musl/release/aria-agent release/
          cp ebpf-artifacts/libebpf_firewall.so release/libebpf_firewall.so
          # During the perf-first rollout we publish an explicit _perf sibling so
          # resolver auto mode can select it without changing the default base path.
          cp release/libebpf_firewall.so release/libebpf_firewall_perf.so
          echo "=== release contents ==="
          ls -la release/

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd release
          zip -r ../firewall-binaries-x86_64.zip .
          cd ..
          ls -lh firewall-binaries-x86_64.zip

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: firewall-binaries-x86_64
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firewall-binaries-x86_64.zip
          generate_release_notes: true
