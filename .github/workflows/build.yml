name: Build

on:
  push:
    branches: [main, 'v*']
    tags: ['v*']
  pull_request:
    branches: [main, v0.9-neutron-agent]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      publish_artifacts:
        description: Upload build artifacts. Only takes effect while the repository is public.
        required: false
        default: false
        type: boolean
      run_deep_audit:
        description: Run the complete Stage 1, Stage 2, and Stage 3 static audit.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      rust_required: ${{ steps.rust_changes.outputs.rust_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Rust build changes
        id: rust_changes
        shell: bash
        run: |
          set -euo pipefail
          rust_required=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/v* ]]; then
            rust_required=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_files="$(git diff --name-only --no-renames "origin/${{ github.base_ref }}" "$GITHUB_SHA")"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            if ! changed_files="$(git diff --name-only --no-renames "${{ github.event.before }}" "$GITHUB_SHA")"; then
              echo "Changed files could not be collected for the full push; requiring Rust/eBPF build as fail-closed."
              rust_required=true
            fi
          else
            echo "Push base is unavailable; requiring Rust/eBPF build as fail-closed."
            rust_required=true
          fi

          if [[ "${rust_required}" != "true" ]]; then
            echo "Changed files:"
            printf '%s\n' "${changed_files:-}"
            if [[ -z "${changed_files:-}" ]]; then
              echo "Changed files could not be determined; requiring Rust/eBPF build as fail-closed."
            fi
            rust_required="$(
              printf '%s\n' "${changed_files:-}" |
                python3 ci/rust_build_required.py
            )"
          fi

          echo "rust_required=${rust_required}" >> "$GITHUB_OUTPUT"
          echo "Rust/eBPF build required: ${rust_required}"

  fast-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository text policy and workflow contracts
        run: |
          python3 ci/check_blocked_terms.py
          python3 -m unittest ci.test_public_release_hygiene
          python3 -m unittest ci.test_release_governance
          python3 ci/check_build_workflow_contract.py
          python3 -m unittest ci.test_ci_lane_contract
          python3 -m unittest ci.test_ci001_trusted_gates
          python3 -m unittest ci.test_rust_build_required
          python3 -m unittest ci.test_rust_warning_hygiene
          python3 -m unittest ci.test_ebpf_legacy_packet_bounds
          python3 -m unittest ci.test_ebpf_stack_budget
          python3 -m unittest ci.test_legacy_kernel_canary_contract
          python3 ci/check_rust_warning_hygiene.py
          bash ci/check_release_reproducibility.sh
          python3 ci/test_neutron_aria_acl_nonce_echo.py -v
          bash ci/test_neutron_aria_acl_active_matrix_case.sh
          bash ci/test_neutron_aria_acl_active_matrix_soak.sh

      - name: Check public Neutron contracts
        run: python3 ci/check_neutron_stage1.py --fast-contracts

  neutron-agent-clean-install:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify clean-container agent package install
        run: sudo env "PATH=${PATH}" bash ci/test_neutron_agent_clean_install.sh

  neutron-db-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neutron DB contract dependencies
        run: python3 -m pip install --requirement ci/requirements-neutron-db-contracts.txt

      - name: Run Neutron DB query contracts
        env:
          PYTHONPATH: openstack/neutron_aria
          PYTHONWARNINGS: error
          SQLALCHEMY_WARN_20: "1"
        run: python3 -m unittest neutron_aria.tests.unit.test_aria_acl_sql_query

  rust-behavior:
    needs: changes
    if: needs.changes.outputs.rust_required == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run selected Rust behavior tests
        env:
          RUSTFLAGS: -D warnings
        run: python3 ci/check_neutron_stage1.py --rust-tests-only --rust-toolchain stable

  rust-build:
    needs: changes
    if: needs.changes.outputs.rust_required == 'true'
    runs-on: ubuntu-22.04
    env:
      PUBLISH_BUILD_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_artifacts == true && github.event.repository.private == false) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Report artifact publishing mode
        run: |
          echo "artifact publishing enabled: ${PUBLISH_BUILD_ARTIFACTS}"
          echo "repository private: ${{ github.event.repository.private }}"

      - name: Install Rust nightly (eBPF)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-14
          components: rust-src

      - name: Install Rust stable (userspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang libelf-dev libbpf-dev musl-tools zstd

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install bpf-linker
        run: |
          set -euo pipefail
          version="0.10.4"
          checksum="4dda77daab6c5f120a468e6d3ede2498f5bd47ece712172cfb7290176d93d015"
          archive="$(mktemp)"
          install_dir="${RUNNER_TEMP}/bpf-linker-bin"
          trap 'rm -f "${archive}"' EXIT
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${version}/bpf-linker-x86_64-unknown-linux-musl.tar.zst" \
            --output "${archive}"
          printf '%s  %s\n' "${checksum}" "${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar --zstd --extract --file "${archive}" --directory "${install_dir}"
          test -x "${install_dir}/bpf-linker"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/bpf-linker" --version

      - name: Build eBPF
        env:
          RUSTFLAGS: -D warnings
        run: |
          cd ebpf
          cargo +nightly-2026-07-14 build --release --target bpfel-unknown-none -Z build-std=core --target-dir target
          echo "=== eBPF output candidates ==="
          find target -type f \( -name "libebpf_firewall.so" -o -name "ebpf-firewall" \) \
            -printf '%s %p\n' 2>/dev/null | sort -nr
          ebpf_artifact="$(find target -type f \
            \( -path "*/release/libebpf_firewall.so" -o -path "*/release/ebpf-firewall" \) \
            -size +0c 2>/dev/null | head -1)"
          if [ -z "$ebpf_artifact" ]; then
            echo "non-empty eBPF artifact not found" >&2
            find target -maxdepth 5 -type f 2>/dev/null | sort | head -200 >&2
            exit 1
          fi
          file "$ebpf_artifact"
          mkdir -p ../ebpf-artifacts
          cp "$ebpf_artifact" ../ebpf-artifacts/libebpf_firewall.so

      - name: Find eBPF artifacts
        run: |
          ls -lh ebpf-artifacts/
          file ebpf-artifacts/libebpf_firewall.so

      - name: Enforce legacy eBPF stack budget
        run: |
          python3 -m pip install --disable-pip-version-check pyelftools==0.32
          python3 -m unittest ci.test_ebpf_stack_budget
          python3 ci/check_ebpf_stack_budget.py \
            --artifact ebpf-artifacts/libebpf_firewall.so \
            --max-path-bytes 448 \
            --report ebpf-artifacts/stack-budget.json

      - name: Upload eBPF stack diagnostics
        if: ${{ always() && env.PUBLISH_BUILD_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-stack-diagnostics-${{ github.sha }}
          path: ebpf-artifacts/
          retention-days: 14

      - name: Build userspace (static)
        env:
          RUSTFLAGS: -D warnings
        run: cargo +stable build --release -p ariactl --target x86_64-unknown-linux-musl

      - name: Build agent (static)
        env:
          RUSTFLAGS: -D warnings
        run: cargo +stable build --release -p aria-agent --target x86_64-unknown-linux-musl

      - name: Verify static binaries
        run: |
          file target/x86_64-unknown-linux-musl/release/ariactl
          ldd target/x86_64-unknown-linux-musl/release/ariactl 2>&1 || true
          file target/x86_64-unknown-linux-musl/release/aria-agent
          ldd target/x86_64-unknown-linux-musl/release/aria-agent 2>&1 || true

      - name: Prepare release files
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/ariactl release/
          cp target/x86_64-unknown-linux-musl/release/aria-agent release/
          cp ebpf-artifacts/libebpf_firewall.so release/libebpf_firewall.so
          cp release/libebpf_firewall.so release/libebpf_firewall_perf.so
          cp ebpf-artifacts/stack-budget.json release/stack-budget.json
          cp VERSION LICENSE CHANGELOG.md release/
          echo "=== release contents ==="
          ls -la release/

      - name: Build Neutron stage-two ACL Kolla bundle
        run: bash deploy/kolla/package/build_stage2_acl_bundle.sh

      - name: Check Neutron stage-two ACL Kolla bundle payload policy
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true'
        run: python3 ci/check_payload_terms.py dist/kolla/neutron-aria-stage2-acl-kolla-bundle.tgz

      - name: Upload Neutron stage-two ACL Kolla bundle
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neutron-aria-stage2-acl-kolla-bundle-${{ github.sha }}
          path: dist/kolla/neutron-aria-stage2-acl-kolla-bundle.tgz
          retention-days: 14

      - name: Build optional Neutron Aria agent image tar
        if: ${{ env.PUBLISH_BUILD_ARTIFACTS == 'true' && vars.KOLLA_NEUTRON_AGENT_BASE_IMAGE != '' }}
        run: |
          release_version="v$(tr -d '[:space:]' < VERSION)"
          image_tag="neutron-aria-agent:${release_version}-stage2-acl"
          image_tar="dist/kolla/neutron-aria-agent-${release_version}-stage2-acl-image.tar"
          BASE_IMAGE="${{ vars.KOLLA_NEUTRON_AGENT_BASE_IMAGE }}" \
            IMAGE_TAG="${image_tag}" \
            SAVE_IMAGE=true \
            IMAGE_TAR="${image_tar}" \
            bash deploy/kolla/package/build_neutron_aria_agent_image.sh

      - name: Check optional Neutron Aria agent image payload policy
        if: ${{ env.PUBLISH_BUILD_ARTIFACTS == 'true' && vars.KOLLA_NEUTRON_AGENT_BASE_IMAGE != '' }}
        run: python3 ci/check_payload_terms.py dist/kolla/neutron-aria-agent-*-stage2-acl-image.tar

      - name: Upload optional Neutron Aria agent image tar
        if: ${{ env.PUBLISH_BUILD_ARTIFACTS == 'true' && vars.KOLLA_NEUTRON_AGENT_BASE_IMAGE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: neutron-aria-agent-stage2-acl-image-${{ github.sha }}
          path: dist/kolla/neutron-aria-agent-*-stage2-acl-image.tar
          retention-days: 14

      - name: Build optional Aria datapath image tar
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true' && vars.KOLLA_ARIA_DATAPATH_BASE_IMAGE != ''
        run: |
          release_version="v$(tr -d '[:space:]' < VERSION)"
          image_tag="aria-datapath:${release_version}-stage2-acl"
          image_tar="dist/kolla/aria-datapath-${release_version}-stage2-acl-image.tar"
          BASE_IMAGE="${{ vars.KOLLA_ARIA_DATAPATH_BASE_IMAGE }}" \
            IMAGE_TAG="${image_tag}" \
            ARTIFACT_DIR=release \
            SAVE_IMAGE=true \
            IMAGE_TAR="${image_tar}" \
            bash deploy/kolla/package/build_aria_datapath_image.sh

      - name: Create release archive
        run: |
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          touch -d "@${source_date_epoch}" \
            release/aria-agent release/ariactl \
            release/libebpf_firewall.so release/libebpf_firewall_perf.so \
            release/stack-budget.json release/VERSION release/LICENSE \
            release/CHANGELOG.md release/support-matrix.json
          cd release
          zip -X ../firewall-binaries-x86_64.zip \
            aria-agent ariactl libebpf_firewall.so libebpf_firewall_perf.so \
            stack-budget.json VERSION LICENSE CHANGELOG.md support-matrix.json
          cd ..
          ls -lh firewall-binaries-x86_64.zip

      - name: Create release manifest and checksums
        run: |
          set -euo pipefail
          args=(
            --repo-root .
            --source-commit "${GITHUB_SHA}"
            --artifact "aria-agent=release/aria-agent"
            --artifact "ariactl=release/ariactl"
            --artifact "libebpf_firewall.so=release/libebpf_firewall.so"
            --artifact "libebpf_firewall_perf.so=release/libebpf_firewall_perf.so"
            --artifact "stack-budget.json=release/stack-budget.json"
            --artifact "neutron-aria-stage2-acl-kolla-bundle.tgz=dist/kolla/neutron-aria-stage2-acl-kolla-bundle.tgz"
            --artifact "firewall-binaries-x86_64.zip=firewall-binaries-x86_64.zip"
            --output release/release-manifest.json
            --checksums-output release/SHA256SUMS
          )
          for image_tar in dist/kolla/*-stage2-acl-image.tar; do
            if [ -f "${image_tar}" ]; then
              args+=(--artifact "$(basename "${image_tar}")=${image_tar}")
            fi
          done
          release_version="v$(tr -d '[:space:]' < VERSION)"
          datapath_tag="aria-datapath:${release_version}-stage2-acl"
          if docker image inspect "${datapath_tag}" >/dev/null 2>&1; then
            datapath_id="$(docker image inspect -f '{{.Id}}' "${datapath_tag}")"
            args+=(--image "aria-datapath=${datapath_tag}@${datapath_id}")
          fi
          agent_tag="neutron-aria-agent:${release_version}-stage2-acl"
          if docker image inspect "${agent_tag}" >/dev/null 2>&1; then
            agent_id="$(docker image inspect -f '{{.Id}}' "${agent_tag}")"
            args+=(--image "neutron-aria-agent=${agent_tag}@${agent_id}")
          fi
          python3 ci/create_release_manifest.py "${args[@]}"

      - name: Check optional Aria datapath image payload policy
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true' && vars.KOLLA_ARIA_DATAPATH_BASE_IMAGE != ''
        run: python3 ci/check_payload_terms.py dist/kolla/aria-datapath-*-stage2-acl-image.tar

      - name: Upload optional Aria datapath image tar
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true' && vars.KOLLA_ARIA_DATAPATH_BASE_IMAGE != ''
        uses: actions/upload-artifact@v4
        with:
          name: aria-datapath-stage2-acl-image-${{ github.sha }}
          path: dist/kolla/aria-datapath-*-stage2-acl-image.tar
          retention-days: 14

      - name: Check Rust binary release payload policy
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true'
        run: python3 ci/check_payload_terms.py release firewall-binaries-x86_64.zip

      - name: Upload artifacts
        if: env.PUBLISH_BUILD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firewall-binaries-x86_64
          path: |
            release/
            firewall-binaries-x86_64.zip

  release:
    needs:
      - fast-contracts
      - neutron-agent-clean-install
      - neutron-db-contracts
      - rust-behavior
      - rust-build
      - deep-audit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release tag against manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(python3 -c 'import json; print(json.load(open("release-assets/release/release-manifest.json"))["product_version"])')"
          test "${RELEASE_TAG}" = "${expected}" || {
            echo "release tag ${RELEASE_TAG} does not match manifest ${expected}" >&2
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-assets/firewall-binaries-x86_64.zip
            release-assets/neutron-aria-stage2-acl-kolla-bundle.tgz
            release-assets/release/release-manifest.json
            release-assets/release/SHA256SUMS
            release-assets/neutron-aria-agent-*-stage2-acl-image.tar
            release-assets/aria-datapath-*-stage2-acl-image.tar
          fail_on_unmatched_files: false
          generate_release_notes: true

  deep-audit:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_deep_audit == true)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Stage 1 static and artifact contracts
        run: python3 ci/check_neutron_stage1.py

      - name: Validate Stage 2 static artifacts and historical evidence
        run: |
          python3 ci/check_neutron_stage2_acl.py
          python3 ci/check_n05_discovery_evidence.py
          python3 ci/check_uds_hardening_evidence.py \
            --evidence-dir docs/evidence/openstack-n05-lite/20260630131254-compute-1.example.test \
            --evidence-dir docs/evidence/openstack-n05-lite/20260630133213-compute-2.example.test \
            --evidence-dir docs/evidence/openstack-n05-lite/20260630133213-compute-3.example.test \
            --min-hosts 3 \
            --require-hardened
          python3 ci/check_stage2_acceptance_evidence.py

      - name: Validate Stage 3 static artifacts and historical evidence
        run: |
          python3 ci/check_stage3_readiness.py
          python3 ci/check_stage3_n3_evidence.py
          python3 ci/check_smoke_python_blocks.py
