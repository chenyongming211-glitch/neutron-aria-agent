name: Build

on:
  push:
    branches: [main, 'v*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Rust stable (userspace)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang libelf-dev libbpf-dev musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/bpf-linker
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install bpf-linker
        run: |
          command -v bpf-linker >/dev/null 2>&1 || cargo +nightly install bpf-linker

      - name: Build eBPF
        run: cd ebpf && cargo +nightly build --release --target-dir target

      - name: Find eBPF artifacts
        run: |
          echo "=== ebpf/target/ ==="
          find ebpf/target -type f ! -path "*/deps/*" ! -path "*/.fingerprint/*" ! -name "*.d" ! -name "*.rlib" 2>/dev/null | head -20
          echo "=== workspace target/bpfel* ==="
          find target/bpfel-unknown-none -type f ! -path "*/deps/*" ! -path "*/.fingerprint/*" ! -name "*.d" ! -name "*.rlib" 2>/dev/null | head -20

      - name: Build userspace (static)
        run: cargo +stable build --release -p ariactl --target x86_64-unknown-linux-musl

      - name: Build agent (static)
        run: cargo +stable build --release -p aria-agent --target x86_64-unknown-linux-musl

      - name: Verify static binaries
        run: |
          file target/x86_64-unknown-linux-musl/release/ariactl
          ldd target/x86_64-unknown-linux-musl/release/ariactl 2>&1 || true
          file target/x86_64-unknown-linux-musl/release/aria-agent
          ldd target/x86_64-unknown-linux-musl/release/aria-agent 2>&1 || true

      - name: Prepare release files
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/ariactl release/
          cp target/x86_64-unknown-linux-musl/release/aria-agent release/
          # eBPF 产物搜索 ebpf/target 和 workspace target 两个位置
          find ebpf/target target/bpfel-unknown-none -maxdepth 3 -name "*ebpf_firewall*" -type f ! -name "*.d" 2>/dev/null | while read f; do
            cp "$f" release/
          done
          # During the perf-first rollout we publish an explicit _perf sibling so
          # resolver auto mode can select it without changing the default base path.
          if [ -f release/libebpf_firewall.so ] && [ ! -f release/libebpf_firewall_perf.so ]; then
            cp release/libebpf_firewall.so release/libebpf_firewall_perf.so
          fi
          echo "=== release contents ==="
          ls -la release/

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd release
          zip -r ../firewall-binaries-x86_64.zip .
          cd ..
          ls -lh firewall-binaries-x86_64.zip

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: firewall-binaries-x86_64
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firewall-binaries-x86_64.zip
          generate_release_notes: true
