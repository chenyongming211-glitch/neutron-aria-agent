name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Install bpf target
        run: rustup target add bpfel-unknown-none

      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang libelf-dev libbpf-dev

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF
        run: cargo build --release -p ebpf-firewall --target bpfel-unknown-none

      - name: Build user-space
        run: cargo build --release -p firewall-ctl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firewall-binaries
          path: |
            target/bpfel-unknown-none/release/libebpf_firewall.so
            target/release/firewall-ctl
