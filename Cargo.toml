[workspace]
members = ["user", "ebpf", "core", "agent", "api"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Your Name <email@example.com>"]

[workspace.dependencies]
aya = "0.13.1"
aya-log = "0.2"
aya-ebpf = "0.1"
network-types = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
libc = "0.2"
fslock = "0.2"
aria-core = { path = "core" }
aria-api = { path = "api" }
rtnetlink = "0.14"
netlink-packet-route = "0.19"
netlink-packet-core = "0.7"
netlink-sys = "0.8"
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
regex = "1"
toml = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
