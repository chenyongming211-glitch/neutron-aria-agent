[package]
name = "ebpf-firewall"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aya-ebpf = { version = "0.1", features = ["btf"] }
network-types.workspace = true

[profile.dev]
opt-level = 3
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
