[agent]
# Set this to the same host value shown by neutron agent-list, for example
# compute-1.example.test. If empty, neutron-aria-agent uses socket.getfqdn().
host =
managed_domains = acl
state_dir = /var/lib/neutron-aria-agent/state
report_interval = 30
# summary_only keeps neutron agent-show bounded regardless of local port count.
# legacy_sample temporarily restores three-row port/event samples for a rolling
# upgrade; do not use it as the steady-state product setting.
heartbeat_detail_mode = summary_only
resync_interval = 60
resync_backoff_initial = 5
resync_backoff_max = 300
# Kolla launcher writes stdout/stderr to:
# /var/log/kolla/neutron/neutron-aria-agent.log

# Product-safe default: heartbeat only. Full resync must stay disabled until
# port_source is configured and the local aria-agent UDS endpoint is deployed.
full_resync_enabled = false

[ovs]
integration_bridge = br-int

[aria]
socket_path = /run/aria/aria-agent.sock
request_timeout = 3.0
# If a mutating UDS request times out, status-check whether aria-datapath
# completed the detached apply task before marking the agent degraded.
timeout_convergence_attempts = 15
timeout_convergence_interval = 1.0

[neutron]
# disabled: report heartbeat only; no Neutron ports are read and no snapshot is
# submitted.
# neutronclient: use legacy python-neutronclient with OS_* credentials from the
# container environment to list ports bound to this host.
port_source = disabled
port_page_size = 100
acl_page_size = 100

# Product-safe default: do not subscribe to Neutron RPC events until full
# resync, UDS snapshot and RabbitMQ credentials are configured for this agent.
rpc_events_enabled = false
# P3 port-scoped incremental apply is implemented but stays disabled by default.
incremental_rpc_enabled = false
# Old Neutron environments that do not expose port revision_number may only use
# this explicit test-only mode on controlled hosts. Keep disabled in packaged
# defaults and production.
revisionless_incremental_mode = disabled
event_merge_interval = 0.2
# Absolute drain deadline measured from the first pending event: sustained event
# streams can never starve the merge drain longer than this bound.
event_max_merge_delay = 5.0
event_queue_max_ports = 10000
event_queue_max_networks = 1000

[acl]
# Product-safe default: no ACL source until fixture smoke or aria_acl production
# input is explicitly enabled.
source = disabled
