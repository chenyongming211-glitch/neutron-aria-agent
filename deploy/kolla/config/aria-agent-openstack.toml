mode = "neutron_managed"
auto_attach = false

ebpf_path = "/usr/local/lib/libebpf_firewall.so"
trace_backend = "auto"
trace_auto_allow_ringbuf = false

pin_path = "/sys/fs/bpf/aria"
state_path = "/var/lib/aria-agent"
iface_pattern = "^tap"
max_port_policies = 16384

# Fragment tracking stays unavailable until privileged field evidence is recorded.
fragment_tracking_field_verified = false

listen_addr = "127.0.0.1:8080"
neutron_socket_path = "/run/aria/aria-agent.sock"
# Decimal 432 is octal 0660. The neutron-aria-agent container must share the
# neutron-aria group instead of relying on a world-writable control socket.
neutron_socket_mode = 432
# Peer credential enforcement is a production hardening gate. Keep audit-only
# in the safe default bundle until N0.5 records the final container uid/gid.
neutron_peercred_enforce = false
neutron_peercred_allowed_uids = []
neutron_peercred_allowed_gids = []
neutron_audit_log_path = "/var/log/kolla/aria-datapath/neutron-uds-audit.log"
ovs_bridge = "br-int"

log_format = "text"
log_filter = "info"
log_file_path = "/var/log/kolla/aria-datapath/aria-datapath.log"

[fragment_tracking]
enabled = false
max_entries = 8192
ipv4_timeout_seconds = 30
ipv6_timeout_seconds = 30
