mode = "neutron_managed"
auto_attach = false

ebpf_path = "/usr/local/lib/libebpf_firewall.so"
trace_backend = "auto"
trace_auto_allow_ringbuf = false

pin_path = "/sys/fs/bpf/aria"
state_path = "/var/lib/aria-agent"
iface_pattern = "^tap"
max_port_policies = 16384

listen_addr = "127.0.0.1:8080"
neutron_socket_path = "/run/aria/aria-agent.sock"
# Decimal 438 is octal 0666. This keeps the datapath container privileged while
# allowing the non-privileged neutron-aria-agent container to reach the UDS.
# Production deployments can tighten this to 432 (0660) after sharing a group.
ovs_bridge = "br-int"

log_format = "text"
log_filter = "info"
log_file_path = "/var/log/kolla/aria-datapath/aria-datapath.log"

# Stage-two G4 hardened UDS rollout smoke.
neutron_socket_mode = 432
neutron_peercred_enforce = true
neutron_peercred_allowed_uids = [42435]
neutron_peercred_allowed_gids = [42435]
neutron_audit_log_path = "/var/log/kolla/aria-datapath/neutron-uds-audit.log"
